name: Diagnose-Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Diagnostik & Build
        run: |
          # 1. Zeige uns, welche Java-Version aktiv ist
          java -version
          
          # 2. SDK-Lizenzen vorbereiten (Die "Brechstange")
          mkdir -p $ANDROID_HOME/licenses
          echo -e "\n8933bad161af4178b1185d1a37fbf41ea5269c55" > $ANDROID_HOME/licenses/android-sdk-license
          
          # 3. Den eigentlichen Build mit maximalem Info-Level starten
          # Wenn es schiefgeht, werden wir jetzt GENAU den Fehler sehen!
          ./gradlew assembleDebug --stacktrace --info --warning-mode all
        
      - name: Upload APK (Falls erfolgreich)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
